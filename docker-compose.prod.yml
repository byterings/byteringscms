# Self-hosted production deployment.
#
#   cp .env.production.example .env.production   # then edit every value
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Caddy terminates HTTPS (automatic certificates for $DOMAIN) and is the only
# service exposed to the network. The API and database stay internal.
name: bytecontent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_USER: byterings
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://byterings:${APP_DB_PASSWORD}@postgres:5432/byterings
      RUN_MIGRATIONS: 'true'
      TENANCY_MODE: ${TENANCY_MODE:-single}
      # Requests arrive through Caddy and the Admin Studio proxy.
      TRUST_PROXY: 'true'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TENANT_MAX_RECORDS: ${TENANT_MAX_RECORDS:-0}
      TENANT_MAX_MEDIA_BYTES: ${TENANT_MAX_MEDIA_BYTES:-0}
    volumes:
      - media:/data/storage

  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [admin]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Daily housekeeping: docker compose --env-file .env.production -f docker-compose.prod.yml run --rm maintenance
  maintenance:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ['jobs']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://byterings:${APP_DB_PASSWORD}@postgres:5432/byterings
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - media:/data/storage
    command: ['node', 'dist/cli/maintenance.js']

volumes:
  postgres-data:
  media:
  caddy-data:
  caddy-config:
